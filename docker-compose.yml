# MySQL محلي للتطوير — نفس إعداد VPS تقريباً
# التشغيل: docker compose up -d
# الإيقاف: docker compose down
# (البيانات تبقى في volume pos_mysql_data)

services:
  mysql:
    image: mysql:8.0
    container_name: pos_mysql_local
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pos_root_local
      MYSQL_DATABASE: pos_db
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_local_dev
    volumes:
      - pos_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ppos_root_local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pos_mysql_data:
