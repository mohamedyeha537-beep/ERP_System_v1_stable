{% macro dash_badge(counts, section) -%}
{% if counts and counts.get(section, 0) > 0 %}
{% set _is_hk = section in ('hotel_housekeeping', 'hotel_cleaning') %}
{% set _is_debt = section == 'hotel_debts' %}
<span class="ql-badge{% if _is_hk or _is_debt %} ql-badge--bell{% endif %}" title="{% if section == 'kds' %}تذاكر مطبخ — تُزال بعد إنجاز التحضير{% elif section == 'inventory' %}نفاد مخزون أو حركات جديدة — النفاد يبقى حتى إعادة التخزين{% elif section == 'purchases' %}فواتير شراء بانتظار السداد{% elif section == 'assets' %}أصول جديدة — راجع السجل واعتمدها{% elif section == 'messaging_inbox' %}عملاء بانتظار رد — تُزال بعد الرد{% elif section == 'messaging_chat_orders' %}طلبات شات بانتظار تأكيد الكاشير{% elif section == 'hotel_settle' %}غرف بانتظار تسوية{% elif section == 'hotel_bookings' %}حجوزات حالية (معلّق / مؤكد / مسكّن){% elif section == 'hotel_housekeeping' or section == 'hotel_cleaning' %}شقق بانتظار التنظيف — عيّن موظفاً؛ يبقى التنبيه حتى اكتمال التنظيف{% elif section == 'hotel_debts' %}حجوزات عليها دين أو متبقٍ — يبقى حتى التحصيل{% elif section == 'hotel_dashboard' %}نزلاء مسكّنون حالياً{% elif section == 'hotel_quotations' %}عروض شركات قيد المتابعة{% elif section == 'hotel_calendar' %}وصول ومغادرة اليوم{% elif section == 'hotel_shift' %}لا توجد جلسة فندق مفتوحة — افتح الجلسة{% else %}إشعار — يُمسح بفتح القسم{% endif %}">{% if _is_hk or _is_debt %}<span class="ql-badge__bell" aria-hidden="true">🔔</span>{% endif %}{{ counts[section] }}</span>
{% endif %}
{%- endmacro %}
