{% extends "base.html" %}
{% block title %}تعديل دور{% endblock %}
{% block body %}
<h1>تعديل الدور: {{ role.name_ar }}</h1>
<div class="card">
  <form method="post" action="/admin/roles/{{ role.id }}">
    <label for="name_ar">اسم الدور</label>
    <input id="name_ar" name="name_ar" value="{{ role.name_ar }}" required />
    <h3 style="margin-bottom: 0.25rem">الصلاحيات</h3>
    <p class="muted" style="margin-top: 0">اختر ما ينطبق على هذا الدور.</p>
    {% for p in perms %}
    <label style="display: flex; gap: 0.5rem; align-items: center; max-width: none">
      <input type="checkbox" name="perm_ids" value="{{ p.id }}" {% if p.id in role_perm_ids %}checked{% endif %} />
      <span>{{ p.label_ar }} <span class="muted">({{ p.code }})</span></span>
    </label>
    {% endfor %}
    <div class="row" style="margin-top: 1rem">
      <button class="btn btn-primary" type="submit">حفظ</button>
      <a class="btn" href="/admin/roles">رجوع</a>
    </div>
  </form>
</div>
{% endblock %}
