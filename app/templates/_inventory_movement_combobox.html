<div class="bom-combobox" data-searchable-combobox data-submit-on-select="false">
  <input type="hidden" name="product_id" data-combobox-value required value="" />
  <div class="bom-combobox-field">
    <input
      type="text"
      class="bom-combobox-input"
      data-combobox-input
      placeholder="ابحث عن الصنف…"
      autocomplete="off"
      role="combobox"
      aria-expanded="false"
      aria-autocomplete="list"
    />
    <button type="button" class="bom-combobox-toggle" aria-label="فتح القائمة" tabindex="-1">▾</button>
  </div>
  <div class="bom-combobox-menu" data-combobox-menu hidden role="listbox">
    <button
      type="button"
      class="bom-combobox-option muted"
      role="option"
      data-value=""
      data-label="— اختر صنفاً —"
    >— اختر صنفاً —</button>
    {% for p in all_products %}
    <button
      type="button"
      class="bom-combobox-option"
      role="option"
      data-value="{{ p.id }}"
      data-label="{{ p.name_ar }} — رصيد: {{ pos_qty_plain(balances[p.id]) }} {{ p.unit }}{% if p.barcode %} · {{ p.barcode }}{% endif %}"
    >{{ p.name_ar }} — رصيد: {{ pos_qty_plain(balances[p.id]) }} {{ p.unit }}{% if p.barcode %} · {{ p.barcode }}{% endif %}</button>
    {% endfor %}
    <p class="bom-combobox-empty muted" data-combobox-empty hidden>لا توجد نتائج مطابقة</p>
  </div>
</div>
