<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% include "_public_web_head.html" %}
  {% if web_mkt is not defined or not web_mkt %}<title>حجز إقامة</title>{% endif %}
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body style="max-width:720px;margin:0 auto;padding:1rem">
  <h1>🏨 حجز شقة فندقية</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/stay/search" class="card" id="stay-search-form">
    <label>تاريخ الوصول</label>
    <input name="check_in" type="date" required />
    <label>تاريخ المغادرة</label>
    <input name="check_out" type="date" required />
    <label>بالغون</label>
    <input name="adults" type="number" value="1" min="1" />
    <label>أطفال</label>
    <input name="children" type="number" value="0" min="0" />
    <button class="btn btn-primary" type="submit" style="margin-top:0.75rem">بحث التوفر</button>
  </form>
  <script>
  (function(){
    var f = document.getElementById("stay-search-form");
    if (!f) return;
    f.addEventListener("submit", function(){
      if (window.WebAnalytics) {
        var ci = f.querySelector('[name="check_in"]');
        var co = f.querySelector('[name="check_out"]');
        WebAnalytics.trackSearch({
          search_term: (ci && ci.value) + " → " + (co && co.value)
        });
      }
    });
  })();
  </script>
{% include "_public_web_body.html" %}
</body>
</html>
